[pack]
id = "node-client"
name = "TypeScript Node Client"
version = "0.13.0"
description = "TypeScript/Node.js API client using native fetch"
field_casing = "camel"
operation_casing = "camel"

[type_map]
string = "string"
number = "number"
integer = "number"
boolean = "boolean"
null = "null"
datetime = "string"
binary = "Blob"
any = "unknown"
void = "void"
string_literal = '"{value}"'
integer_literal = "{value}"
ref = "{name}"
array = "{inner}[]"
array_union = "({inner})[]"
map = "Record<string, {inner}>"
object = "{ {fields} }"
object_empty = "Record<string, unknown>"
object_field_required = "{name}: {type}"
object_field_optional = "{name}?: {type}"
object_field_separator = "; "
union_separator = " | "
intersection_separator = " & "
optional_suffix = ""

[filters]
escape_jsdoc = { replace = "*/", with = "*\\/" }

[layouts.modular]
files = [
  { path = "{source_dir}/types.ts", template = "types.ts.j2" },
  { path = "{source_dir}/guards.ts", template = "guards.ts.j2" },
  { path = "{source_dir}/sse.ts", template = "sse.ts.j2" },
  { path = "{source_dir}/client.ts", template = "client.ts.j2" },
  { path = "{source_dir}/index.ts", template = "index.ts.j2" },
]

[layouts.bundled]
output_path = "{source_dir}/index.ts"
sections = [
  { label = "Types", template = "types.ts.j2" },
  { label = "Guards", template = "guards.ts.j2" },
  { label = "SSE Runtime", template = "sse.ts.j2" },
  { label = "Client", template = "client.ts.j2" },
]
strip_patterns = [
  "^// Auto-generated by oag.*$",
]
strip_import_patterns = [
  '"./types"',
  '"./guards"',
  '"./sse"',
  '"./client"',
]

[layouts.split]
shared_files = [
  { path = "{source_dir}/types.ts", template = "types.ts.j2" },
  { path = "{source_dir}/guards.ts", template = "guards.ts.j2" },
  { path = "{source_dir}/sse.ts", template = "sse.ts.j2" },
  { path = "{source_dir}/client.ts", template = "client.ts.j2" },
]

[scaffold]
files = [
  { path = "package.json", template = "package.json.j2" },
  { path = "tsconfig.json", template = "tsconfig.json.j2" },
  { path = "biome.json", template = "biome.json.j2", when = "scaffold.formatter == 'biome'" },
  { path = "tsdown.config.ts", template = "tsdown.config.ts.j2", when = "scaffold.bundler == 'tsdown'" },
]
test_files = [
  { path = "{source_dir}/client.test.ts", template = "client.test.ts.j2", when = "scaffold.test_runner" },
]

[formatters]
biome = { detect = "biome.json", command = "npx @biomejs/biome check --write ." }
