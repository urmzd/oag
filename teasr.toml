[output]
dir = "./showcase"
formats = [{ output_type = "gif" }]

[[scenes]]
type = "terminal"
name = "demo"
theme = "dracula"
cols = 100
rows = 27
cwd = "examples/petstore"
formats = [{ output_type = "gif" }, { output_type = "png" }]
frame_duration = 120

[scenes.intro]
text = """
╭──────────────────────────────────────────────╮
│                                              │
│        ✦  OpenAPI Generator (oag)  ✦         │
│                                              │
│         github.com/urmzd · urmzd.com         │
│                                              │
╰──────────────────────────────────────────────╯
"""
duration = 1500
center = true

# Neutral prompt, no username or path
[[scenes.interactions]]
type = "type"
text = 'export PS1="$ " && clear'
speed = 20
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 500
hidden = true

[[scenes.interactions]]
type = "type"
text = 'oag generate 2>&1 | grep -E "generated [0-9]+ files"'
speed = 20

[[scenes.interactions]]
type = "key"
key = "enter"

[[scenes.interactions]]
type = "wait"
duration = 2500

[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
type = "type"
text = "head -n 22 generated/node/src/types.ts"
speed = 20

[[scenes.interactions]]
type = "key"
key = "enter"

[[scenes.interactions]]
type = "wait"
duration = 1500

[[scenes.interactions]]
type = "snapshot"
name = "demo"
