[project]
name = "literal-default-fastapi-server"
version = "0.1.0"
description = "Auto-generated FastAPI server"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
