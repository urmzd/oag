name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  fsrc:
    name: fsrc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: urmzd/fsrc@v4
        with:
          commit-message: "chore: sync embedded files [skip ci]"

  ci:
    needs: fsrc
    uses: ./.github/workflows/ci.yml

  release:
    environment: release
    name: Release
    needs: [ci, fsrc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.sr.outputs.released }}
      tag: ${{ steps.sr.outputs.tag }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Example regeneration + validation now runs in the reusable CI workflow
      # (the `examples` job), which this release depends on via `needs: ci`, so
      # the gate has already passed by the time we get here.
      - name: Release
        id: sr
        uses: urmzd/sr@v9
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-15
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p oag
          else
            cargo build --release --target ${{ matrix.target }} -p oag
          fi
        shell: bash

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          if [ -f "target/${{ matrix.target }}/release/oag.exe" ]; then
            ASSET="oag-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/oag.exe" "$ASSET"
          else
            ASSET="oag-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/oag" "$ASSET"
            chmod +x "$ASSET"
          fi
          # Per-asset checksum sidecar, verified by `oag update`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
        shell: bash

  checksums:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    name: Publish SHA256SUMS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Hash the assets as published (what install.sh downloads), check them
      # against each build's sidecar, and publish one SHA256SUMS file that
      # install.sh verifies before installing.
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'oag-*'
          for sidecar in *.sha256; do
            sha256sum --check --strict "$sidecar"
          done
          rm -f -- *.sha256
          sha256sum oag-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "${{ github.repository }}" --clobber
