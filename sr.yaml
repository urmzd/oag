# sr configuration — merged with new defaults
# Run 'sr init --force' for a fully-commented template.

branches:
- main
tag_prefix: v
commit_pattern: ^(?P<type>\w+)(?:\((?P<scope>[^)]+)\))?(?P<breaking>!)?:\s+(?P<description>.+)
breaking_section: Breaking Changes
misc_section: Miscellaneous
types:
- name: feat
  bump: minor
  section: Features
- name: fix
  bump: patch
  section: Bug Fixes
- name: perf
  bump: patch
  section: Performance
- name: docs
  section: Documentation
- name: refactor
  bump: patch
  section: Refactoring
- name: revert
  section: Reverts
- name: chore
- name: ci
- name: test
- name: build
- name: style
version_files:
- crates/oag-core/Cargo.toml
- crates/oag-cli/Cargo.toml
- Cargo.toml
changelog:
  file: CHANGELOG.md
  template: null
floating_tags: true
version_files_strict: false
artifacts: []
build_command: null
stage_files: []
prerelease: null
pre_release_command: ./scripts/pre-release.sh
post_release_command: null
sign_tags: false
draft: false
release_name_template: null
hooks:
  commit-msg:
  - sr hook commit-msg
